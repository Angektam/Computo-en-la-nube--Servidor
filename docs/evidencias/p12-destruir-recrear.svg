<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#111827"/><rect width="1200" height="42" fill="#1f2937"/><circle cx="22" cy="21" r="7" fill="#ef4444"/><circle cx="45" cy="21" r="7" fill="#f59e0b"/><circle cx="68" cy="21" r="7" fill="#22c55e"/><text x="95" y="27" fill="#d1d5db" font-family="monospace" font-size="18">AWS CloudShell — destrucción y recreación</text><g fill="#d1d5db" font-family="monospace" font-size="19"><text x="30" y="88" fill="#93c5fd">$ aws cloudformation delete-stack --stack-name p12-losrojos-iac</text><text x="30" y="132">DESTROY_SECONDS=31</text><text x="30" y="204" fill="#93c5fd">$ aws cloudformation create-stack --stack-name p12-losrojos-iac ...</text><text x="30" y="248">RECREATE_SECONDS=32</text><text x="30" y="304" fill="#86efac">CREATE_COMPLETE</text><text x="30" y="380">La infraestructura se reconstruyó desde el mismo archivo declarativo.</text><text x="30" y="448" fill="#9ca3af">Resultado final: stack aplicado y operativo.</text></g></svg>
